*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#c{position:absolute;display:block}

#touch{position:fixed;left:0;right:0;bottom:0;height:48vmin;display:none;z-index:5;pointer-events:none}
body.touchon #touch{display:block}
#zone{position:absolute;left:0;bottom:0;width:46%;height:100%;pointer-events:auto}
#stick{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:36vmin;height:36vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.10),rgba(255,255,255,.03) 65%,rgba(255,255,255,0));border:2px solid rgba(255,255,255,.28);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:15vmin;height:15vmin;margin:-7.5vmin 0 0 -7.5vmin;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.6),rgba(255,255,255,.18));border:2px solid rgba(255,255,255,.5)}
#btns{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,14.5vmin);grid-template-rows:9vmin 14.5vmin 14.5vmin;gap:2vmin;pointer-events:auto}
.b{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:2.7vmin;letter-spacing:.02em;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);text-shadow:0 1px 2px #000}
.b.on{filter:brightness(1.9);transform:scale(.92)}
.b.p{border-color:#ff7b7baa;background:rgba(255,80,80,.2)}
.b.k{border-color:#7bbcffaa;background:rgba(80,160,255,.2)}
.b.sp{border-color:#ffd24aaa;background:rgba(255,200,60,.22)}
.b.th{border-color:#c09bffaa;background:rgba(170,120,255,.2)}
.b.su{grid-column:1/4;border-radius:999px;font-size:3.2vmin;opacity:.4}
.b.su.ready{opacity:1;background:linear-gradient(90deg,#ff7a18,#ffd200);color:#300;text-shadow:none;border-color:#fff;animation:pl .5s infinite alternate}
@keyframes pl{to{filter:brightness(1.35)}}

<script>
(()=>{
'use strict';
const VW=960,VH=540,GY=468,STAGE_W=1520,BL=50,BR=STAGE_W-50,G=0.8,TAU=Math.PI*2;
const FONT='"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",Impact,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const isTouch=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window);
let DPR=1,SC=1;
const rad=d=>d*Math.PI/180,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
const ease=t=>{t=clamp(t,0,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;};
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const V=(x,s)=>(x!==null&&typeof x==='object'&&'L' in x)?x[s||'L']:x;
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h.slice(0,6),16);return[(n>>16)&255,(n>>8)&255,n&255];}
const _sh={};
function shade(h,k){const key=h+k;if(_sh[key])return _sh[key];let[r,g,b]=hex2rgb(h);if(k<1){r*=k;g*=k;b*=k;}else{r+=(255-r)*(k-1);g+=(255-g)*(k-1);b+=(255-b)*(k-1);}return _sh[key]=`rgb(${r|0},${g|0},${b|0})`;}
function rgba(h,a){const[r,g,b]=hex2rgb(h);return`rgba(${r},${g},${b},${a})`;}
function srand(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}



/* ================= AUDIO ENGINE ================= */
const AU={c:null,m:null,mus:null,sfx:null,rev:null,dly:null,muted:false,nb:null};
function makeIR(c,sec,decay){const r=c.sampleRate,len=r*sec|0,b=c.createBuffer(2,len,r);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}return b;}
function audioInit(){
 if(AU.c){if(AU.c.state==='suspended')AU.c.resume();return;}
 try{const C=window.AudioContext||window.webkitAudioContext,c=AU.c=new C();
  const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.18;
  AU.m=c.createGain();AU.m.gain.value=.85;AU.m.connect(comp);comp.connect(c.destination);
  AU.mus=c.createGain();AU.mus.gain.value=.42;AU.mus.connect(AU.m);
  AU.sfx=c.createGain();AU.sfx.gain.value=.8;AU.sfx.connect(AU.m);
  const vc=c.createDynamicsCompressor();vc.threshold.value=-20;vc.ratio.value=3;vc.attack.value=.003;vc.release.value=.12;AU.vox=c.createGain();AU.vox.gain.value=1.25;AU.vox.connect(vc);vc.connect(AU.m);
  const cv=c.createConvolver();cv.buffer=makeIR(c,2.4,2.6);AU.rev=c.createGain();AU.rev.gain.value=.55;AU.rev.connect(cv);cv.connect(AU.m);
  const d=c.createDelay(1.5),fb=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;fb.gain.value=.32;
  AU.dly=c.createGain();AU.dly.gain.value=.5;AU.dly.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(AU.m);AU.dlyNode=d;
  const len=c.sampleRate,b=c.createBuffer(1,len,c.sampleRate),dd=b.getChannelData(0);for(let i=0;i<len;i++)dd[i]=Math.random()*2-1;AU.nb=b;
  MUS.next=c.currentTime+.1;
  setTimeout(()=>{try{loadVoices();}catch(e){}},0);
 }catch(e){AU.c=null;}
}
function send(node,amt,bus){if(amt>0){const g=AU.c.createGain();g.gain.value=amt;node.connect(g);g.connect(bus);}}
function env(g,t,a,peak,dec,sus,rel,end){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.setTargetAtTime(peak*sus,t+a,dec);g.gain.setTargetAtTime(0.0001,end,rel);}
function nz(t,dur,f0,f1,vol,type,q,dest,rv){const c=AU.c,s=c.createBufferSource();s.buffer=AU.nb;const fl=c.createBiquadFilter();fl.type=type||'bandpass';fl.Q.value=q||1;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl);fl.connect(g);g.connect(dest||AU.sfx);if(rv)send(g,rv,AU.rev);s.start(t,Math.random()*.5);s.stop(t+dur+.02);}
function tn(t,f0,f1,dur,vol,type,dest,rv){const c=AU.c,o=c.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(dest||AU.sfx);if(rv)send(g,rv,AU.rev);o.start(t);o.stop(t+dur+.02);}
function sfx(n){
 if(!AU.c||AU.muted)return;const t=AU.c.currentTime;
 switch(n){
  case'wL':nz(t,.09,900,2800,.18,'bandpass',.9);break;
  case'wH':nz(t,.17,450,2400,.3,'bandpass',.7);break;
  case'slash':nz(t,.2,6000,900,.32,'bandpass',1.4,null,.15);tn(t,1800,600,.12,.05,'sawtooth');break;
  case'hL':nz(t,.07,3200,500,.5,'lowpass',1);tn(t,190,70,.08,.5);break;
  case'hH':nz(t,.16,2600,300,.75,'lowpass',1,null,.12);tn(t,130,40,.2,.85);tn(t,70,35,.28,.5,'triangle');break;
  case'hS':nz(t,.24,4200,200,.85,'lowpass',.8,null,.25);tn(t,110,30,.32,.95);nz(t+.02,.25,1300,300,.32,'bandpass',2);break;
  case'cut':nz(t,.12,7000,1500,.5,'bandpass',1.2,null,.15);tn(t,160,50,.18,.6);break;
  case'blk':tn(t,1500,900,.06,.2,'square');nz(t,.07,5200,3000,.32,'highpass',1);break;
  case'proj':tn(t,220,880,.25,.2,'sawtooth',null,.2);nz(t,.3,800,3000,.2,'bandpass',3);break;
  case'shot':nz(t,.16,5000,400,.6,'lowpass',.8,null,.2);tn(t,900,120,.14,.25,'square');break;
  case'ice':tn(t,2600,1400,.3,.12,'triangle',null,.4);tn(t,3300,2100,.3,.08,'sine',null,.4);nz(t,.35,8000,4000,.18,'highpass');break;
  case'quake':nz(t,.6,420,60,.95,'lowpass',.7,null,.3);tn(t,62,30,.55,.75);break;
  case'void':tn(t,90,40,.6,.5,'sawtooth',null,.4);nz(t,.5,300,2000,.3,'bandpass',4,null,.3);break;
  case'grab':nz(t,.08,1200,600,.32,'bandpass',2);tn(t,300,200,.06,.2,'square');break;
  case'slam':nz(t,.38,1500,80,.95,'lowpass',.8,null,.2);tn(t,92,30,.38,1);break;
  case'land':nz(t,.08,700,150,.24,'lowpass');break;
  case'super':tn(t,180,1700,.6,.24,'sawtooth',null,.5);nz(t,.7,500,7000,.28,'bandpass',2,null,.5);tn(t,90,90,.7,.2,'square');break;
  case'beam':nz(t,1.2,300,4000,.45,'bandpass',.6,null,.3);tn(t,70,140,1.2,.4,'sawtooth');break;
  case'ko':nz(t,1,3000,60,1,'lowpass',.6,null,.5);tn(t,160,30,1.1,1);tn(t+.05,80,25,1.3,.85,'triangle');break;
  case'sel':tn(t,660,660,.05,.14,'square');break;
  case'ok':tn(t,520,1040,.12,.2,'square',null,.2);tn(t+.06,780,1560,.12,.14,'square',null,.2);break;
  case'back':tn(t,500,250,.1,.15,'square');break;
  case'bell':[523,659,784,1046].forEach((f,i)=>tn(t+i*.012,f,f,1.4,.11,'triangle',null,.6));nz(t,1.2,9000,5000,.15,'highpass',1,null,.5);break;
  case'fight':tn(t,110,55,.5,.6,'sawtooth',null,.3);nz(t,.6,2000,200,.6,'lowpass',1,null,.5);[392,523,659].forEach(f=>tn(t,f,f,.6,.12,'sawtooth',null,.4));break;
  case'tech':tn(t,800,1200,.1,.22,'square');nz(t,.1,4000,2000,.22,'highpass');break;
 }
}

/* ---------- music ---------- */
const MUS={on:true,song:null,step:0,next:0,once:false};
const NOTE={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const n2m=s=>{const m=s.match(/^([A-G][#b]?)(-?\d)$/);return 12*(+m[2]+1)+NOTE[m[1]];};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function chordOf(name){const m=name.match(/^([A-G][#b]?)(m?)(7?)(sus)?$/);const r=36+NOTE[m[1]];const third=m[4]?5:m[2]?3:4;const t=[r,r+third,r+7];if(m[3])t.push(r+(m[2]?10:10));return t;}
function parseMel(s){const out={};let st=0;for(const tok of s.trim().split(/\s+/)){if(tok==='|')continue;const[n,d]=tok.split(':');const len=+d;if(n!=='-')out[st]=[n2m(n),len];st+=len;}return out;}
function pat(s){return s.replace(/\s/g,'').split('');}
/* instruments */
function iKick(t,v=1){const c=AU.c,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(42,t+.11);g.gain.setValueAtTime(.95*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.38);o.connect(g);g.connect(AU.mus);o.start(t);o.stop(t+.4);nz(t,.02,5000,2000,.25*v,'highpass',1,AU.mus);}
function iSnare(t,v=1){nz(t,.2,2400,1400,.55*v,'bandpass',.7,AU.mus,.22);nz(t,.12,7000,5000,.25*v,'highpass',1,AU.mus);tn(t,200,150,.1,.35*v,'triangle',AU.mus);}
function iClap(t,v=1){for(let i=0;i<3;i++)nz(t+i*.011,.05,1600,1200,.35*v,'bandpass',1.5,AU.mus,.2);nz(t+.03,.22,1500,900,.3*v,'bandpass',1,AU.mus,.3);}
function iHat(t,open,v=1){nz(t,open?.22:.04,9500,8000,(open?.16:.13)*v,'highpass',1,AU.mus);}
function iCrash(t){nz(t,1.6,8000,3000,.25,'highpass',.7,AU.mus,.3);}
function iTom(t,f,v=1){tn(t,f,f*.55,.35,.7*v,'sine',AU.mus,.25);nz(t,.06,1200,400,.2*v,'lowpass',1,AU.mus);}
function iTaiko(t,v=1){tn(t,95,50,.55,.95*v,'sine',AU.mus,.35);nz(t,.12,900,200,.4*v,'lowpass',1,AU.mus,.2);}
function iBass(t,m,dur,o){o=o||{};const c=AU.c,f=mtof(m),g=c.createGain(),fl=c.createBiquadFilter();fl.type='lowpass';fl.Q.value=o.q||7;
 fl.frequency.setValueAtTime(o.cut||2200,t);fl.frequency.exponentialRampToValueAtTime(o.cutEnd||260,t+Math.min(dur,.25));
 [-8,8].forEach(dt=>{const s=c.createOscillator();s.type='sawtooth';s.frequency.value=f;s.detune.value=dt;s.connect(fl);s.start(t);s.stop(t+dur+.1);});
 const sub=c.createOscillator();sub.type='sine';sub.frequency.value=f/2;const sg=c.createGain();sg.gain.value=.6;sub.connect(sg);sg.connect(g);sub.start(t);sub.stop(t+dur+.1);
 fl.connect(g);env(g,t,.005,(o.v||.3),.12,.7,.03,t+dur*.92);g.connect(AU.mus);}
function iPad(t,notes,dur,o){o=o||{};const c=AU.c,g=c.createGain(),fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.cut||1400;fl.Q.value=.5;
 for(const m of notes)[-12,0,11].forEach(dt=>{const s=c.createOscillator();s.type=o.wave||'sawtooth';s.frequency.value=mtof(m+12);s.detune.value=dt;s.connect(fl);s.start(t);s.stop(t+dur+1.2);});
 fl.connect(g);env(g,t,o.att||.25,(o.v||.05),.6,.8,.35,t+dur);g.connect(AU.mus);send(g,.6,AU.rev);}
function iPluck(t,m,dur,o){o=o||{};const c=AU.c,s=c.createOscillator(),g=c.createGain(),fl=c.createBiquadFilter();s.type=o.wave||'square';s.frequency.value=mtof(m);fl.type='lowpass';fl.Q.value=4;
 fl.frequency.setValueAtTime(o.cut||4200,t);fl.frequency.exponentialRampToValueAtTime(500,t+.18);s.connect(fl);fl.connect(g);g.gain.setValueAtTime(o.v||.09,t);g.gain.exponentialRampToValueAtTime(.001,t+Math.max(.12,dur));g.connect(AU.mus);send(g,o.dly===undefined?.45:o.dly,AU.dly);send(g,.2,AU.rev);s.start(t);s.stop(t+dur+.2);}
function iKoto(t,m,dur){const c=AU.c;[[1,'triangle',.16],[2,'sine',.05],[3.01,'sine',.025]].forEach(([k,w,v])=>{const s=c.createOscillator(),g=c.createGain();s.type=w;s.frequency.value=mtof(m)*k;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.9);s.connect(g);g.connect(AU.mus);send(g,.35,AU.dly);send(g,.35,AU.rev);s.start(t);s.stop(t+1);});}
function iLead(t,m,dur,o){o=o||{};const c=AU.c,g=c.createGain(),fl=c.createBiquadFilter(),lfo=c.createOscillator(),lg=c.createGain();fl.type='lowpass';fl.frequency.value=o.cut||3400;fl.Q.value=1.5;
 lfo.frequency.value=5.5;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(o.vib||9,t+Math.min(.35,dur*.6));lfo.connect(lg);lfo.start(t);lfo.stop(t+dur+.5);
 const ws=o.waves||[['sawtooth',-7],['square',7],['sawtooth',1200]];
 for(const[w,dt]of ws){const s=c.createOscillator();s.type=w;s.frequency.value=mtof(m);s.detune.value=dt;lg.connect(s.detune);const sg=c.createGain();sg.gain.value=dt===1200?.35:1;s.connect(sg);sg.connect(fl);s.start(t);s.stop(t+dur+.5);}
 fl.connect(g);env(g,t,o.att||.012,(o.v||.075),.25,.75,.09,t+dur*.95);g.connect(AU.mus);send(g,.3,AU.dly);send(g,.35,AU.rev);}
function iFlute(t,m,dur){const c=AU.c,s=c.createOscillator(),g=c.createGain(),lfo=c.createOscillator(),lg=c.createGain();s.type='sine';s.frequency.value=mtof(m);lfo.frequency.value=5;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(14,t+.4);lfo.connect(lg);lg.connect(s.detune);
 s.connect(g);env(g,t,.06,.13,.3,.8,.12,t+dur*.95);g.connect(AU.mus);send(g,.5,AU.rev);send(g,.25,AU.dly);s.start(t);s.stop(t+dur+.6);lfo.start(t);lfo.stop(t+dur+.6);nz(t,Math.min(dur,.4),2500,1800,.04,'bandpass',2,AU.mus,.3);}
function iBrass(t,notes,dur,v=.06){const c=AU.c,g=c.createGain(),fl=c.createBiquadFilter();fl.type='lowpass';fl.Q.value=2;fl.frequency.setValueAtTime(600,t);fl.frequency.linearRampToValueAtTime(3200,t+.08);fl.frequency.setTargetAtTime(1400,t+.1,.2);
 for(const m of notes)[-6,6].forEach(dt=>{const s=c.createOscillator();s.type='sawtooth';s.frequency.value=mtof(m+24);s.detune.value=dt;s.connect(fl);s.start(t);s.stop(t+dur+.4);});
 fl.connect(g);env(g,t,.03,v,.3,.75,.1,t+dur);g.connect(AU.mus);send(g,.45,AU.rev);}

const SONGS={

 s0:{bpm:150,bars:8,chords:'Am F G Em Am F G E',
  mel:'A4:2 C5:2 E5:4 D5:2 C5:2 B4:2 C5:2 | A4:6 F4:2 A4:2 C5:4 -:2 | B4:2 D5:2 G5:4 F5:2 E5:2 D5:2 B4:2 | E5:12 -:4 | A5:2 G5:2 E5:4 A5:2 G5:2 E5:2 C5:2 | D5:4 C5:2 A4:2 C5:4 D5:4 | B4:4 D5:4 G5:4 F5:2 D5:2 | G#4:4 B4:4 E5:6 -:2',

 bgmStop();BGM.want=n;const tok=++BGM.tok;

}

/* ================= AI ================= */
class AI{
 constructor(f,lvl){this.f=f;this.L=lvl;this.P=[{re:24,bl:.22,aa:.15,ag:.35,cb:.15,pu:.15},{re:13,bl:.55,aa:.5,ag:.55,cb:.55,pu:.5},{re:6,bl:.85,aa:.85,ag:.7,cb:.9,pu:.9}][lvl];
  this.q=[];this.cur=null;this.cool=0;this.seenAtk=-1;this.reactAt=-1;this.seenProj=null;this.projAt=-1;this.aaId=-1;this.last={u:0,d:0,l:0,r:0};}
 dirTo(n){const f=this.f,fw=f.face>0?'r':'l',bk=f.face>0?'l':'r',o={u:0,d:0,l:0,r:0};n=+n;if(n<=3)o.d=1;if(n>=7)o.u=1;if(n%3===1)o[bk]=1;if(n%3===0)o[fw]=1;return o;}
 clear(){this.q.length=0;this.cur=null;}
 hold(){return{u:this.last.u,d:this.last.d,l:this.last.l,r:this.last.r};}
 input(){
  this.update();
  if(!this.cur&&this.q.length){this.cur=this.q.shift();this.cur.i=0;}
  let out={u:0,d:0,l:0,r:0};
  if(this.cur){const s=this.cur;out=this.dirTo(s.d||'5');if(s.i===0&&s.b)for(const b of s.b)out[b]=1;s.i++;if(s.i>=(s.n||1))this.cur=null;}
  this.last=out;return out;
 }
 sp(role){return this.f.d.specials.find(s=>s.role===role);}
 motion(sp,str,extra=0){const btn=sp.b==='P'?(str==='H'?'HP':'LP'):(str==='H'?'HK':'LK');const st=sp.m.split('').map(d=>({d,n:2}));st[st.length-1].b=[btn];st[st.length-1].n=3;st.push({d:'5',n:12+extra});return st;}
 combo(){const r=Math.random,s=[],end=this.sp('rush')||this.sp('low')||this.sp('aa');
  const q=r();if(q<.4)s.push({d:'2',b:['LK'],n:6},{d:'2',b:['LK'],n:6});else if(q<.75)s.push({d:'5',b:['HP'],n:9});else s.push({d:'5',b:['LP'],n:6},{d:'6',b:['HP'],n:12});
  if(end&&r()<this.P.cb)s.push(...this.motion(end,'H'));else s.push({d:'5',n:14});return s;}
 update(){
  const f=this.f,o=f.op,P=this.P,fr=game.lf,R=Math.random;
  if(game.phase!=='play'){this.clear();return;}
  if(this.cool>0)this.cool--;
  const free=['stand','walk','crouch','guard','cguard'].includes(f.st),dist=Math.abs(o.x-f.x);
  if(['hstun','launched','down','held','getup'].includes(f.st)){this.clear();}
  if(o.st==='attack'&&o.mv&&(o.mv.hit||o.mv.grab)&&this.seenAtk!==o.atkId){this.seenAtk=o.atkId;this.reactAt=fr+P.re+(R()*6|0);this.reactMv=o.mv;}
  const pr=projs.find(p=>p.o===o&&!p.dead&&Math.sign(f.x-p.x)===Math.sign(p.vx)&&Math.abs(f.x-p.x)<340);
  if(pr&&this.seenProj!==pr){this.seenProj=pr;this.projAt=fr+P.re;}
  if(free||f.st==='bstun'){
   if(this.reactAt>0&&fr>=this.reactAt){this.reactAt=-1;
    if(o.st==='attack'&&o.mv&&dist<260&&R()<P.bl){this.clear();
     if(o.mv.grab){this.q.push({d:'4',n:4},{d:'7',n:3},{d:'5',n:20});return;}
     const low=(o.mv.hit&&o.mv.hit.type==='low'),over=o.mv.hit&&o.mv.hit.type==='over';
     this.q.push({d:(low||(!over&&R()<.5))?'1':'4',n:16});return;}}
   if(this.projAt>0&&fr>=this.projAt&&pr){this.projAt=-1;
    if(R()<P.bl+.1){this.clear();const dpx=Math.abs(f.x-pr.x);
     if(!pr.kind.startsWith('quake')&&R()<.3&&dpx>110&&dpx<260)this.q.push({d:'9',n:3},{d:'6',n:20},{d:'6',b:['HK'],n:2},{d:'5',n:12});
     else this.q.push({d:pr.kind.startsWith('quake')?'1':'4',n:26});return;}}
   if(o.y<GY-20&&o.vy>-2&&dist<210&&this.aaId!==o.jumpId&&Math.sign(o.vx||0)!==Math.sign(o.x-f.x)){this.aaId=o.jumpId;
    if(R()<P.aa){this.clear();const aa=this.sp('aa');this.q.push(...(aa?this.motion(aa,'H',6):[{d:'2',b:['HP'],n:14}]));return;}}
  }
  if(this.q.length||this.cur||!free||this.cool>0)return;
  this.neutral(dist);
 }
 neutral(dist){
  const f=this.f,o=f.op,P=this.P,R=Math.random(),r=Math.random;
  const proj=this.sp('proj'),grab=this.sp('grab'),tele=this.sp('tele');
  if(f.meter>=100&&r()<.2*P.ag+.04&&dist<(f.d.superRange||200)&&o.y>=GY-1&&!['down','getup','launched'].includes(o.st)){this.q.push({d:'5',b:['SU'],n:2},{d:'5',n:30});return;}
  if(o.st==='attack'&&o.mv&&o.mf>V(o.mv.st,o.str)+V(o.mv.ac,o.str)&&dist<170&&r()<P.pu){this.q.push(...this.combo());return;}
  if(o.st==='land'&&o.landLag>8&&dist<170&&r()<P.pu){this.q.push(...this.combo());return;}
  if(dist>400){
   if(proj&&f.projCount===0&&R<.35+P.ag*.2)this.q.push(...this.motion(proj,r()<.5?'H':'L',10));
   else if(R<.75)this.q.push({d:'6',n:20+(r()*25|0)});
   else if(R<.85)this.q.push({d:'6',n:2},{d:'5',n:2},{d:'6',n:3},{d:'5',n:16});
   else this.q.push({d:'5',n:12});
  }else if(dist>180){
   if(proj&&f.projCount===0&&R<.22)this.q.push(...this.motion(proj,r()<.5?'H':'L'));
   else if(tele&&R<.3)this.q.push(...this.motion(tele,'L',8));
   else if(R<.45)this.q.push({d:'6',n:10+(r()*15|0)});
   else if(R<.45+.22*P.ag){const w=13+(r()*5|0);this.q.push({d:'9',n:3},{d:'6',n:w},{d:'6',b:[r()<.6?'HK':'HP'],n:2},{d:'5',n:8});if(r()<P.cb)this.q.push(...this.combo());}
   else if(R<.8)this.q.push({d:'4',n:10});
   else this.q.push({d:'5',n:10});
  }else{
   if(grab&&dist<100&&R<.22)this.q.push(...this.motion(grab,'H'));
   else if(dist<80&&R<.12)this.q.push({d:'6',b:['TH'],n:2},{d:'5',n:16});
   else if(R<.28+P.cb*.35)this.q.push(...this.combo());
   else if(R<.62){const pk=[['2','LK'],['5','LK'],['5','HP'],['2','HK'],['5','HK'],['5','LP'],['6','HP'],['6','HK'],['6','HP']][r()*9|0];this.q.push({d:pk[0],b:[pk[1]],n:3},{d:pk[0],n:14});}
   else if(R<.82)this.q.push({d:'1',n:16});
   else this.q.push({d:'4',n:2},{d:'5',n:2},{d:'4',n:3},{d:'5',n:14});
  }
  this.cool=[14,6,2][this.L];
 }
}

function bez(c,x0,y0,cx,cy,x1,y1){c.beginPath();c.moveTo(x0,y0);c.quadraticCurveTo(cx,cy,x1,y1);c.stroke();}
function glowAt(c,x,y,r,col,a){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba('#ffffff',.9*a));g.addColorStop(.3,rgba(col,.6*a));g.addColorStop(1,rgba(col,0));c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);}
function bolt(c,x0,y0,x1,y1,col,w){c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x0,y0);const n=6;for(let i=1;i<n;i++){const k=i/n;c.lineTo(lerp(x0,x1,k)+rnd(-9,9),lerp(y0,y1,k)+rnd(-9,9));}c.lineTo(x1,y1);c.stroke();}
function drawParts(c){
 for(const p of parts){const a=clamp(p.life/p.max,0,1);
  switch(p.k){
   case'flash':c.globalCompositeOperation='lighter';glowAt(c,p.x,p.y,p.r*(1.4-a*.4),p.c,a);break;
   case'ring':c.globalCompositeOperation='lighter';c.strokeStyle=rgba(p.c,a);c.lineWidth=3*a+1;c.beginPath();c.arc(p.x,p.y,p.r,0,TAU);c.stroke();break;
   case'line':c.globalCompositeOperation='lighter';c.strokeStyle=rgba(p.c,a);c.lineWidth=p.w*a+.5;c.lineCap='round';seg(c,[p.x,p.y],[p.x-p.vx*2.2,p.y-p.vy*2.2]);break;
   case'ember':c.globalCompositeOperation='lighter';c.fillStyle=rgba(p.c,a);c.beginPath();c.arc(p.x,p.y,p.r,0,TAU);c.fill();break;
   case'glow':c.globalCompositeOperation='lighter';glowAt(c,p.x,p.y,p.r,p.c,a*.6);break;
   case'dust':c.globalCompositeOperation='source-over';c.fillStyle=rgba(p.c,a*.35);c.beginPath();c.arc(p.x,p.y,p.r,0,TAU);c.fill();break;
   case'rock':c.globalCompositeOperation='source-over';c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.globalAlpha=a;c.fillStyle=p.c;c.fillRect(-p.r,-p.r*.7,p.r*2,p.r*1.4);c.restore();break;
  }}
 c.globalCompositeOperation='source-over';
}

 pushbox();distLimit();

 if(game.mode==='train'){for(const f of F){f.meter=100;if(f.op.comboT<=0&&['stand','crouch','walk','guard','cguard'].includes(f.st)&&f.hp<f.maxhp){f.hp=f.maxhp;f.red=f.maxhp;}}}

function modePick(k){
 if(k==='diff'){game.diff=(game.diff+1)%3;sfx('sel');return;}
 if(k==='bgm'){MUS.on=!MUS.on;bgmSync();sfx('sel');return;}
 if(k==='howto'){game.scene='howto';sfx('ok');return;}
 game.mode=k;sfx('ok');toSelect();
}
function menuAction(act,pl){
 audioInit();const S=game.scene;if(S==='loading')return;
 if(S==='title'){if(act==='ok')toMode();return;}
 if(S==='mode'){const n=MODES.length;if(act==='up'){game.menuI=(game.menuI+n-1)%n;sfx('sel');}else if(act==='down'){game.menuI=(game.menuI+1)%n;sfx('sel');}
  else if(act==='left'||act==='right'){if(MODES[game.menuI].k==='diff'){game.diff=(game.diff+(act==='left'?2:1))%3;sfx('sel');}}else if(act==='ok')modePick(MODES[game.menuI].k);else if(act==='back'){game.scene='title';sfx('back');}return;}
 if(S==='howto'){if(act==='ok'||act==='back'){game.scene='mode';sfx('back');}return;}
 if(S==='select'){selectAction(act,pl);return;}
 if(S==='vs'){if(act==='ok')beginFight();return;}
 if(S==='fight'){if(act==='pause'){if(game.phase==='intro'&&game.phaseT<4)return;game.paused=!game.paused;crowdBedLevel(game.paused?0:.03);game.pauseI=0;game.showMoves=false;sfx(game.paused?'ok':'back');return;}if(game.paused)pauseAction(act);return;}
 if(S==='result')resultAction(act);
}
